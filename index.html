  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

  color-scheme:dark}}
:root[data-theme="dark"]{

  --ink:#eeeaea; --muted:#a69e9f; --accent:#ec7a7f; --accent-ink:#2a0b0d; --accent-soft:#45221f;

  --p1:#7fb3ec; --p2:#d199e0; --p3:#4fd0c2; --p4:#f39a66; --p5:#ee8fb3; --p6:#bccd62; --p7:#cfae86; --p8:#ff8ab5;

.tbl{overflow-x:auto}

.stat.static{cursor:default}
.mini .slot[draggable="true"]{cursor:grab}.mini .slot[draggable="true"]:hover{outline:2px solid var(--accent-soft)}.mini .d.dropok{outline:2px dashed var(--accent);outline-offset:-2px}

const NIVELES=["Primaria","ESO","Bachillerato","Universidad","Adultos","Otro"];

      sin.push(it)}
    for(const it of sin.filter(it=>esManana(p,dia,it.c.hora))){const i=KEY_INI[it.c.hora];out.push({...it,ini:i,fin:i+60,tipo:"60",conf:false})}
    const tar=sin.filter(it=>!esManana(p,dia,it.c.hora)), conf=out.filter(x=>x.conf&&x.ini>=720), xh=c=>c.xh||c.hora;
    if(tar.length&&conf.length){

        const g=conf.find(x=>x.tipo==="grupo"&&xh(x.c)===it.c.hora);
        if(g){out.push({...it,ini:g.ini,fin:g.fin,tipo:"grupo",conf:false});continue}
        const n=HORAS.indexOf(it.c.hora), prev=conf.filter(x=>HORAS.indexOf(xh(x.c))<n).sort((u,v)=>HORAS.indexOf(xh(u.c))-HORAS.indexOf(xh(v.c))||u.fin-v.fin).pop();

function lineaFecha(p,f,base,res){

    if(r.de.fecha===f&&(r.de.profe||r.profe)===p){const i=r.de.ini?minDe(r.de.ini):null;const x=L.find(x=>x.n>0&&(i!=null?x.ini===i:x.key===r.de.hora));if(x)x.n--}
    if(r.a.fecha===f&&(r.a.profe||r.profe)===p){const i=r.a.ini?minDe(r.a.ini):(KEY_INI[r.a.hora]??960),d=+r.a.dur||60;const x=L.find(x=>x.ini===i&&x.cap>1);if(x)x.n++;else L.push({ini:i,fin:i+d,cap:1,n:1,key:keyDeMin(i)})}}

/* Horas que se le pueden ofrecer a un alumno: huecos libres del horario de la profesora del tamaño de su sesión
   (o grupos con sitio, si su clase es de grupo). mias: intervalos en los que el alumno ya tiene clase. todas: también ocupadas. */
function libresFecha(p,f,dur,grupo,L,mias,todas){
  const dia=diaDe(f), out=[], pisa=(i,fn)=>mias.some(([x,y])=>i<y&&fn>x);
  if(grupo)for(const x of L)if(x.cap>1&&(todas||x.n<x.cap)&&!pisa(x.ini,x.fin))out.push({ini:x.ini,dur:x.fin-x.ini,n:x.n,cap:x.cap,full:x.n>=x.cap});
  for(const [x,y] of tramosDe(p,dia)){
    const oc=L.filter(o=>o.fin>x&&o.ini<y).sort((u,v)=>u.ini-v.ini);
    let t=x;const hu=[];for(const o of oc){if(o.ini>t)hu.push([t,o.ini]);t=Math.max(t,o.fin)}if(y>t)hu.push([t,y]);
    for(const [u,v] of hu)for(let i=u;i+dur<=v;i+=dur)if(!pisa(i,i+dur))out.push({ini:i,dur,n:0,cap:grupo?CAP:1,full:false});
    if(todas)for(const o of oc)if(o.cap===1&&o.ini+dur<=y&&!pisa(o.ini,o.ini+dur))out.push({ini:o.ini,dur,n:o.n,cap:1,full:true});
  }
  const vistos=new Set();
  return out.sort((u,v)=>u.ini-v.ini||u.full-v.full).filter(o=>{const k=o.ini;if(vistos.has(k))return false;vistos.add(k);return true});
}

/* ---------- usuario y clave de cada alumno ----------
   Usuario: primer nombre + 3 primeras letras del primer apellido, en minúsculas y sin tildes (María García López → mariagar).
   Con cuatro palabras o más se toma la penúltima como primer apellido (Juan Manuel González Chamorro → juangon).
   Si coincide con otro, se añade la inicial del segundo apellido y, si aún coincide, un número. Dirección puede cambiarlo en la ficha. */
const PARTIC=new Set(["DE","DEL","LA","LAS","LOS","Y"]);
function usuarioBase(nombre){
  const t=nombre.normalize("NFD").replace(/[̀-ͯ]/g,"").toUpperCase().replace(/[^A-Z0-9]+/g," ").trim().split(" ").filter(Boolean);
  if(!t.length)return ["alumno",""];
  if(t.length===1)return [t[0].toLowerCase(),""];
  const w=t.filter((x,i)=>i===0||!PARTIC.has(x)), k=w.length<=3?1:w.length-2, ap=w[k]||"";
  return [(t[0]+ap.slice(0,3)).toLowerCase(),(w[k+1]||"").slice(0,1).toLowerCase()];
}
/* Protocolo de contraseñas del centro: al menos 6 caracteres, letras y números, sin relación con el usuario.
   Sin letras ni cifras que se confundan (l, o, 0, 1). Las claves antiguas de 4 cifras siguen valiendo hasta que se renueven. */
const CL_L="abcdefghjkmnpqrstuvwxyz",CL_N="23456789";
const nuevaClave=()=>{const a=new Uint32Array(6);crypto.getRandomValues(a);const t=CL_L+CL_N;let c=[...a].map(x=>t[x%t.length]);
  c[a[0]%6]=CL_N[a[1]%CL_N.length];let j=(a[0]+1+(a[2]%5))%6;c[j]=CL_L[a[3]%CL_L.length];return c.join("")};

   alumnos siguen de 6. Una clave del equipo de menos de 10 caracteres se marca como débil. */
const nuevaClaveEquipo=()=>{let c="";while(c.length<12){const k=nuevaClave();c+=k}return c.slice(0,12)};
const claveDebil=k=>!!k&&k.rol!=="alumno"&&String(k.clave||"").length<10;
const normClave=c=>String(c||"").trim().toLowerCase().replace(/[^a-z0-9]/g,"");
const claveVieja=c=>/^\d{4,5}$/.test(String(c||""));
const claveValida=c=>/^(?=.*[a-z])(?=.*\d)[a-z0-9]{6,12}$/.test(c);

function juntarFichas(a,b){
  const uni=(x,y)=>[...new Set([...(x||[]),...(y||[])])],obj=(x,y)=>({...(y||{}),...(x||{})});

  const recNum=r=>r&&(r.numero||r.id);const vr=new Set((a.recibos||[]).map(recNum));
  const r={clases:sinRepetidas([...a.clases,...b.clases]),faltas:porId(a.faltas,b.faltas,"id"),matriculas:[...(a.matriculas||[]),...(b.matriculas||[]).filter(m=>!(a.matriculas||[]).some(n=>stable(n)===stable(m)))],
    recibos:[...(a.recibos||[]),...(b.recibos||[]).filter(x=>!vr.has(recNum(x)))],telefonos:uni(a.telefonos,b.telefonos),asist:obj(a.asist,b.asist),
    puntuales:porId(a.puntuales,b.puntuales,"rid"),inscripciones:[...(a.inscripciones||[]),...(b.inscripciones||[])],trasHechos:uni(a.trasHechos,b.trasHechos),
    sinRecOk:uni(a.sinRecOk,b.sinRecOk),confOk:uni(a.confOk,b.confOk),avisosHorario:[...(a.avisosHorario||[]),...(b.avisosHorario||[])],
    msgResp:obj(a.msgResp,b.msgResp),petResp:obj(a.petResp,b.petResp),cuadreOk:obj(a.cuadreOk,b.cuadreOk),extras:porId(a.extras,b.extras,"id"),

  if(!a.argos&&b.argos)r.argos=b.argos;if(!a.nivel&&b.nivel)r.nivel=b.nivel;if(!a.foto&&b.foto)r.foto=b.foto;

  for(const [id,a] of S.alumnos) if(a.nombre===nombre) return id;

function usuarioLibre(nombre,salvo){

/* Si la app de dirección está abierta en dos pestañas, solo una reparte usuarios (turno de 30 s); después se
   comprueba que no haya dos alumnos con el mismo usuario y, si los hay, el segundo por orden alfabético recibe otro. */
const PESTANA=nuevoToken();
async function completarUsuarios(){
  const falta=sortedAlumnos().filter(([,a])=>!a.bloqueado&&(!a.usuario||!a.clave||!a.token));
  const vistos=new Map(), dup=[];
  for(const [id,a] of sortedAlumnos())if(a.usuario){if(vistos.has(a.usuario))dup.push([id,a]);else vistos.set(a.usuario,id)}
  if(!falta.length&&!dup.length)return;
  try{const l=await S.db.doc("config/turno-usuarios").acquire({holder:PESTANA,ttlMs:30000});if(!l.acquired)return}catch(_){return}
  const tareas=falta.map(([id,a])=>async()=>{const p={};if(!a.usuario)p.usuario=usuarioLibre(a.nombre,id);if(!a.clave)p.clave=nuevaClave();if(!a.token)p.token=nuevoToken();
    Object.assign(a,p);try{await S.db.collection("alumnos").doc(id).update(p)}catch(_){}});
  for(const [id,a] of dup)tareas.push(async()=>{a.usuario="";const u=usuarioLibre(a.nombre,id);a.usuario=u;try{await S.db.collection("alumnos").doc(id).update({usuario:u})}catch(_){}});
  for(const t of tareas)await t();
}

/* ---------- carga del listado de albaranes de Argos ----------
   Dirección sube el PDF o Excel de «Albaranes» de Argos. Cada recibo del archivo sobrescribe el de la app con el mismo número
   (estado, importe, fecha y forma de pago); los anulados se quitan; los nuevos se añaden. Los recibos que no están en el archivo
   no se tocan. Los titulares que no encajan con ningún alumno quedan en config/recibos.sinAlumno para asignarlos a mano, y la
   asignación se recuerda (config/recibos.alias). La fecha de la última carga (config/recibos.ultima) la ven los alumnos. */
const PDFJS="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js", PDFJS_W="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
const XLSXJS="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
const cargarJs=u=>new Promise((ok,ko)=>{if(document.querySelector(`script[data-src="${u}"]`)&&(u===XLSXJS?window.XLSX:window.pdfjsLib))return ok();const x=document.createElement("script");x.src=u;x.dataset.src=u;x.onload=()=>ok();x.onerror=()=>ko(new Error("No se ha podido cargar el lector de archivos. Revisa la conexión e inténtalo de nuevo."));document.head.appendChild(x)});
const nzN=v=>String(v||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toUpperCase().replace(/\(.*?\)/g,"").replace(/[^A-Z]/g,"");
const isoDeES=v=>{const m=String(v||"").match(/(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);if(!m)return "";const y=m[3].length===2?"20"+m[3]:m[3];return `${y}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`};
const numES=v=>{if(typeof v==="number")return v;const t=String(v||"").replace(/[^\d,.-]/g,"");if(!t)return null;const n=t.includes(",")?parseFloat(t.replace(/\./g,"").replace(",",".")):parseFloat(t);return isNaN(n)?null:n};
const estadoArgos=v=>/anulad/i.test(v)?"anulado":/pendiente/i.test(v)?"pendiente":/pagad|factur|cobrad/i.test(v)?"pagado":"pendiente";
const formaArgos=v=>String(v||"").replace(/BIZ\s*UMM/i,"BIZUM").replace(/\s+/g," ").replace(/^-$/,"").trim();
const movilesDe=v=>[...new Set((String(v||"").match(/(?:\+?34[\s.-]?)?[67](?:[\s.-]?\d){8}/g)||[]).map(x=>x.replace(/\D/g,"").slice(-9)))];
function leerAlbaranesPdf(pages){
  let cols=null,cur=null;const out=[];
  for(const items of pages){
    const hdr=items.find(i=>/^n[úu]mero$/i.test(i.s.trim()));
    if(hdr){const g=n=>{const it=items.find(i=>i.s.trim().toLowerCase()===n&&Math.abs(i.y-hdr.y)<3);return it?it.x:null};
      cols={tit:g("titular"),fec:g("fecha"),est:g("estado"),tot:g("total"),fp:g("fecha pago"),tel:g("teléfonos")??g("telefonos")}}
    if(!cols||cols.tit==null||cols.est==null||cols.tot==null||cols.fp==null)continue;
    const its=items.filter(i=>!hdr||i.y<hdr.y-2).sort((u,v)=>v.y-u.y||u.x-v.x);
    for(const it of its){const t=it.s.trim();
      if(it.x<cols.tit-5){if(/^[A-Z]\d{2}\/\d{3,}$/.test(t)){cur={numero:t,y:it.y,tit:[],fec:[],est:[],tf:[],fp:[],tel:[]};out.push(cur)}continue}
      if(!cur||cur.y-it.y>45||/P[áa]gina|Cantidad:|otal:/.test(t))continue;
      const c=it.x<(cols.fec??cols.est)-5?"tit":it.x<cols.est-5?"fec":it.x<cols.tot-5?"est":it.x<cols.fp-5?"tf":(cols.tel!=null&&it.x>=cols.tel-5)?"tel":"fp";
      cur[c].push(t)}
  }
  return out.map(r=>{const tf=r.tf.join(" "),m=tf.match(/([\d.]*\d,\d\d)/);
    return {numero:r.numero,nombre:r.tit.join(" ").replace(/\s+/g," ").trim(),fecha:isoDeES(r.fec.join(" ")),estado:estadoArgos(r.est.join(" ")),importe:m?numES(m[1]):null,
      forma:formaArgos(m?tf.replace(m[1],""):tf),fechaPago:isoDeES(r.fp.join(" ")),tels:movilesDe(r.tel.join(" "))}}).filter(r=>r.nombre&&r.fecha);
}
function leerAlbaranesTabla(rows){
  const h=rows.findIndex(r=>r.some(c=>/n[úu]mero/i.test(c))&&r.some(c=>/titular|alumno|cliente/i.test(c)));
  if(h<0)return [];
  const H=rows[h].map(c=>String(c).trim().toLowerCase()), col=re=>H.findIndex(c=>re.test(c));
  const ci={num:col(/n[úu]mero/),nom:col(/titular|alumno|cliente/),fec:H.findIndex(c=>/^fecha/.test(c)&&!/pago/.test(c)),est:col(/estado/),tot:col(/total|importe/),forma:col(/forma/),fp:col(/fecha.*pago/),tel:col(/tel[ée]f|m[óo]vil/)};
  const v=(r,i)=>i<0?"":String(r[i]??"").trim();
  return rows.slice(h+1).filter(r=>/^[A-Z]\d{2}\/\d{3,}$/.test(v(r,ci.num))).map(r=>({numero:v(r,ci.num),nombre:v(r,ci.nom).replace(/\s+/g," "),fecha:isoDeES(v(r,ci.fec)),estado:estadoArgos(v(r,ci.est)),
    importe:numES(v(r,ci.tot)),forma:formaArgos(v(r,ci.forma)),fechaPago:isoDeES(v(r,ci.fp)),tels:movilesDe(v(r,ci.tel))})).filter(r=>r.nombre&&r.fecha);
}
function idDeTitular(nom,tels){
  const alias=(S.recCfg&&S.recCfg.alias)||{}, k=nzN(nom);if(!k)return null;
  if(alias[k]&&S.alumnos.has(alias[k]))return alias[k];
  const ex=[...S.alumnos].filter(([,a])=>nzN(a.nombre)===k);if(ex.length===1)return ex[0][0];if(ex.length>1)return null;
  const pr=[...S.alumnos].filter(([,a])=>{const w=nzN(a.nombre);return (k.startsWith(w)||w.startsWith(k))&&Math.min(k.length,w.length)>=9});
  if(pr.length===1)return pr[0][0];
  const pw=v=>String(v||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase().replace(/\(.*?\)/g,"").split(/[^A-Z]+/).filter(Boolean);
  const t=pw(nom),kj=t.join(" ");if(t.length<2||kj.length<9)return null;
  const cand=[...S.alumnos].filter(([,a])=>{const w=pw(a.nombre);if(!w.length)return false;
    if(t.length>=3&&w.length===t.length&&w.slice(0,-1).join(" ")===t.slice(0,-1).join(" "))return true;
    return w[0]===t[0]&&levD(w.join(" "),kj)<=2});
  if(!cand.length)return null;
  const d9=x=>String(x||"").replace(/\D/g,"").slice(-9),mis=new Set((tels||[]).map(d9).filter(x=>x.length===9));
  const conTel=cand.filter(([,a])=>(a.telefonos||[]).some(x=>mis.has(d9(x))));
  if(conTel.length===1){if(S._parecidos)S._parecidos.set(nom,conTel[0][1].nombre);return conTel[0][0]}
  if(cand.length===1&&S._sugeridos)S._sugeridos.set(nom,cand[0][1].nombre);

  const cb=S.cb;if(!cb||!cb.selF||!cb.selH){toast("Elige el día y la hora");return}
  const op=(cb.opts||[]).find(x=>x.f===cb.selF&&optId(x)===cb.selH);if(!op){toast("Elige el día y la hora");return}
  const aDe={fecha:cb.selF,hora:op.h,...(op.ini!=null?{ini:hm(op.ini),dur:op.dur}:{})};
  const deDe={fecha:cb.f,hora:cb.h,...(FLEX.has(cb.p)&&cb.i!=null&&!isNaN(cb.i)?{ini:hm(cb.i),dur:cb.dur||60}:{})};
  if(cb.modo==="hueco"){
    const a=S.alumnos.get(cb.id);if(!a||!a.token){toast("Este alumno aún no se puede cambiar. Avisa a dirección.");return}
    const r={rid:nuevoId("p"),tok:a.token,profe:S.myProfe,de:deDe,a:aDe,estado:"aceptada",fecha:todayISO(),origen:"profe",pid:cb.pid};
    const nota=(($("#pet-resp")||{}).value||"").trim().slice(0,500);
    const pr={pid:cb.pid,tok:a.token,profe:S.myProfe,estado:"resuelta",nota,a:r.a,rid:r.rid,fecha:todayISO()};
    if(await guardarRes(r,pr)){S.cb=null;drawCambio();render();toast(`Clase pasada al ${fCorta(r.a.fecha)}`)}
    return;
  }
  if(cb.modo==="fest"){
    const a=S.alumnos.get(cb.id);if(!a||!a.token){toast("Este alumno aún no se puede cambiar. Avisa a dirección.");return}
    const r={rid:nuevoId("p"),tok:a.token,profe:S.myProfe,de:deDe,a:aDe,estado:"aceptada",fecha:todayISO(),origen:"profe"};
    if(await guardarRes(r)){S.cb=null;drawCambio();render();toast(`Clase pasada al ${fCorta(r.a.fecha)}`)}
    return;
  }
  const m=miAlumno();if(!m)return;const {a}=m;
  if(bloqueo(a)){toast("Ya tienes un cambio en curso");return}
  const lim=sumaDias(todayISO(),-60), sol={};

  try{await S.db.doc("buzon/"+S.me).set(d);S.miBuzon=d;S.cb=null;drawCambio();render();toast("Solicitud enviada a "+cb.p)}
  catch(_){toast("No se ha podido enviar. Inténtalo de nuevo.")}
}

/* ---------- cambios: profesoras y dirección ---------- */
async function guardarRes(r,pr){
  const lim=sumaDias(todayISO(),-120), res={}, pres={};
  for(const x of Object.values((S.miBuzon&&S.miBuzon.res)||{}))if(x&&x.de&&maxF(x)>=lim)res[x.rid]=x;
  for(const x of Object.values((S.miBuzon&&S.miBuzon.pres)||{}))if(x&&x.pid&&String(x.fecha)>=lim)pres[x.pid]=x;
  if(r)res[r.rid]=r;
  if(pr)pres[pr.pid]=pr;
  const d={...(S.miBuzon||{}),profe:S.myProfe,res,pres};
  try{await S.db.doc("buzon/"+S.me).set(d);S.miBuzon=d;return true}
  catch(_){toast("No se ha podido guardar. Inténtalo de nuevo.");return false}
}

async function guardarSes(list){
  if(!list.length)return;
  for(const x of list)if(!TIPOS[x.tipo]||isNaN(x.min)){toast("Elige la hora y el tipo");return}
  const t=nowISO();
  if(S.role==="dir"){
    const por=new Map();for(const x of list){if(!por.has(x.s.id))por.set(x.s.id,[]);por.get(x.s.id).push(x)}
    let ok=true;
    for(const [id,xs] of por){const a=S.alumnos.get(id);if(!a)continue;
      const clases=a.clases.map(c=>{const x=xs.find(x=>x.s.c===c);return x?{...c,ini:hm(x.min),tipo:x.tipo,sesT:t,hora:keyDeMin(x.min),xh:c.xh||c.hora}:c});
      if(await save(id,{clases}))a.clases=clases;else ok=false}
    SESC.al=null;if(ok){render();toast(list.length>1?`${list.length} sesiones guardadas`:"Sesión guardada")}
    return;
  }
  if(S.role!=="profe"||!S.myProfe||S.pv)return;
  const prev=(S.miBuzon&&S.miBuzon.ses)||{}, ses={}, vivas=new Set();
  for(const a of S.alumnos.values())for(const c of a.clases)if(c.profe===S.myProfe)vivas.add(ovKey(a.token,c));
  for(const [k,v] of Object.entries(prev))if(vivas.has(k))ses[k]=v;
  for(const x of list){if(!x.s.a.token){toast("Este alumno aún no se puede guardar. Avisa a dirección.");return}ses[ovKey(x.s.a.token,x.s.c)]={ini:hm(x.min),tipo:x.tipo,t}}
  const d={...(S.miBuzon||{}),profe:S.myProfe,ses};
  try{await S.db.doc("buzon/"+S.me).set(d);S.miBuzon=d;rebuildOv();render();toast(list.length>1?`${list.length} sesiones guardadas`:"Sesión guardada")}
  catch(_){toast("No se ha podido guardar. Inténtalo de nuevo.")}
}
const filaSes=k=>{const x=S.sesRows&&S.sesRows[k];if(!x)return null;return {s:x,min:+($("#se-i-"+k)||{}).value,tipo:($("#se-t-"+k)||{}).value}};
/* Dirección: pasa a la ficha lo que las profesoras han confirmado en su buzón */
let aplicandoSes=false;const sesHechas=new Set();
async function aplicarSesProfes(){
  if(S.role!=="dir"||aplicandoSes||!S.alOk||!S.cfgOk||S.pv)return;aplicandoSes=true;
  try{const por=new Map();
    for(const [u,d] of S.buzon){const p=S.cuentas[u];if(!p||!d.ses)continue;
      for(const [k,v] of Object.entries(d.ses)){if(!v||!v.ini||!TIPOS[v.tipo]||sesHechas.has(k+"@"+v.t))continue;
        const [tok,dia,hora,pp]=k.split("|");if(pp!==p)continue;
        const al=alumnoPorToken(tok);if(!al)continue;
        const c=al.a.clases.find(c=>c.dia===dia&&c.hora===hora&&c.profe===p);if(!c)continue;
        if(c.sesT&&String(c.sesT)>=String(v.t))continue;
        sesHechas.add(k+"@"+v.t);if(!por.has(al.id))por.set(al.id,[]);por.get(al.id).push({c,v})}}
    for(const [id,xs] of por){const a=S.alumnos.get(id);if(!a)continue;
      const clases=a.clases.map(c=>{const x=xs.find(x=>x.c===c);return x?{...c,ini:x.v.ini,tipo:x.v.tipo,sesT:x.v.t,hora:keyDeMin(minDe(x.v.ini)),xh:c.xh||c.hora}:c});
      if(await save(id,{clases}))a.clases=clases}
    if(por.size){SESC.al=null;refrescar()}
  }finally{aplicandoSes=false}
}


/* ---------- asistencia ----------
   La profesora pasa lista por fecha: «si» (asistió), «rec» (cambia de día: queda por recuperar) o «norec» (no vino sin avisar:
   no se recupera). Lo guarda en su buzón (campo asis, clave token|fecha|hora|profesora) y sus alumnos lo ven al momento.
   Dirección lo pasa a la ficha: asist[fecha|hora] = {e,p,t} y, si es una falta, una falta con recuperada "pendiente" o "no".
   Recuperada = la falta marcada como recuperada en Faltas. */
const ASIS={si:["b-si","Asistió"],rec:["b-pend","Por recuperar"],recup:["b-si","Recuperada"],norec:["b-no","No recuperable"]};
const asKey=(tok,f,h,p)=>(tok||"")+"|"+f+"|"+h+"|"+p;
function asOvDe(lista){const o={};for(const {p,as} of lista)for(const [k,v] of Object.entries(as||{})){if(!v||!["si","rec","norec"].includes(v.e))continue;if(k.split("|")[3]!==p)continue;if(!o[k]||String(v.t)>String(o[k].t))o[k]=v}return o}
const asOvTodas=()=>asOvDe([...S.buzon].filter(([u])=>S.cuentas[u]).map(([u,d])=>({p:S.cuentas[u],as:d.asis})));
function rebuildAsOv(){
  if(S.pv)return;
  if(S.role==="profe")S.asOv=asOvDe(S.myProfe&&S.miBuzon?[{p:S.myProfe,as:S.miBuzon.asis}]:[]);
  else if(S.role==="alumno")S.asOv=asOvDe((S.respRaw||[]).filter(({uid,x})=>x.profe&&deProfe(uid,x.profe)).map(({x})=>({p:x.profe,as:x.asis})));
  else if(S.role==="dir")S.asOv=asOvTodas();
  else S.asOv={};
}
function asistDe(a,f,h,p){
  const m=(a.asist||{})[f+"|"+h], o=S.asOv&&S.asOv[asKey(a.token,f,h,p)];
  if(o&&(!m||String(o.t)>String(m.t)))return o.e;
  const fa=a.faltas.find(z=>z.fecha===f&&(!z.hora||z.hora===h));
  if(fa)return fa.recuperada==="si"?"recup":fa.recuperada==="no"?"norec":"rec";
  return m&&m.e==="si"?"si":"";
}
/* Todas las faltas y asistencias conocidas de un alumno: [{f,h,p,e}] */
function asistTodas(a){
  const m=new Map();
  for(const z of a.faltas)m.set(z.fecha+"|"+(z.hora||""),{f:z.fecha,h:z.hora||"",p:z.profe||""});
  for(const [k,v] of Object.entries(a.asist||{})){const [f,h]=k.split("|");if(!m.has(k))m.set(k,{f,h,p:v.p||""})}
  for(const k of Object.keys(S.asOv||{})){const [tok,f,h,p]=k.split("|");if(tok&&tok===a.token&&!m.has(f+"|"+h))m.set(f+"|"+h,{f,h,p})}
  return [...m.values()].map(x=>({...x,e:asistDe(a,x.f,x.h,x.p)})).filter(x=>x.e);
}
function aplicaAsis(a,f,h,p,e,t){
  const k=f+"|"+h, prev=a.faltas.find(z=>z.fecha===f&&(!z.hora||z.hora===h));
  const asist={...(a.asist||{}),[k]:{e,p,t}};
  const faltas=a.faltas.filter(z=>z!==prev);
  if(e==="si"&&S.role==="dir"){const fx=recupDe(a,f,h);if(fx){const i=faltas.findIndex(z=>z.id===fx);if(i>=0&&faltas[i].recuperada!=="si")faltas[i]={...faltas[i],recuperada:"si",fechaRecup:f,festT:nowISO(),festPor:"Asistencia"}}}
  if(e!=="si")faltas.push({id:prev?prev.id:uid(),fecha:f,hora:h,profe:p,recuperada:e==="norec"?"no":(prev&&prev.recuperada==="si"?"si":"pendiente"),fechaRecup:prev&&e!=="norec"?prev.fechaRecup||"":"",motivo:e==="norec"?"No vino sin avisar":"Cambia de día"});
  return {asist,faltas};
}
/* 09/11/2026: si el alumno «Asistió» a una clase que era la recuperación programada de una falta (cambio con recup = id de la falta),
   esa falta pasa sola a recuperada «Sí» (antes se quedaba «Sin confirmar» y la profesora no puede tocar Faltas). */
function recupDe(a,f,h){if(!a||!a.token)return "";const r=todasRes().find(r=>r&&r.recup&&r.estado==="aceptada"&&r.tok===a.token&&r.a&&r.a.fecha===f&&(!r.a.hora||r.a.hora===h));return r?r.recup:""}
/* Barrido: recuperaciones ya pasadas con asistencia «Asistió» y la falta aún sin confirmar (dirección, al cargar) */
let recupBarrido=0;
async function recupPendientes(){if(S.role!=="dir"||S.pv||!S.alOk||!S.cfgOk||Date.now()-recupBarrido<55000)return;recupBarrido=Date.now();
  const hoy=todayISO();let n=0;
  for(const [id,a] of S.alumnos){if(!a.token||!(a.faltas||[]).some(z=>z.recuperada==="pendiente"))continue;let faltas=a.faltas,cambia=false;
    for(const r of todasRes()){if(!r||!r.recup||r.estado!=="aceptada"||r.tok!==a.token||!r.a||!r.a.fecha||r.a.fecha>hoy)continue;
      const z=faltas.find(z=>z.id===r.recup);if(!z||z.recuperada!=="pendiente")continue;
      if(asistDe(a,r.a.fecha,r.a.hora,r.a.profe||r.profe)!=="si")continue;
      faltas=faltas.map(y=>y.id===z.id?{...y,recuperada:"si",fechaRecup:r.a.fecha,festT:nowISO(),festPor:"Asistencia"}:y);cambia=true}
    if(cambia&&await save(id,{faltas})){a.faltas=faltas;n++}}
  if(n){refrescar();toast(n===1?"1 falta marcada como recuperada (vino a su recuperación)":n+" faltas marcadas como recuperadas (vinieron a su recuperación)")}}
/* Por si al arrancar aún no estaba todo cargado cuando se pasó la asistencia: se repasa también cada minuto (y a los 8 s de entrar) */
setTimeout(()=>{try{recupPendientes()}catch(_){}},8000);setInterval(()=>{if(S.role==="dir"&&!document.hidden){try{recupPendientes();aplicarFestProfes()}catch(_){}}},60000);
/* Sesiones de una profesora en una fecha concreta (con cambios aceptados y días sin clase) */
function sesionesFecha(p,f){
  const out=[],res=resAceptadas(p);
  for(const [id,a] of sortedAlumnos()){
    const mias=res.filter(r=>r.tok&&r.tok===a.token);
    if(!a.clases.some(c=>c.profe===p)&&!mias.length&&!extrasDe(a).some(e=>e.profe===p&&e.fecha===f))continue;
    for(const o of clasesDia(a,f,mias))if(o.profe===p)out.push({id,a,o});
  }
  for(const r of res)if(r.origen==="traspaso"&&r.profe===p&&r.a&&r.a.fecha===f&&!alumnoPorToken(r.tok)){
    const id="tok:"+r.tok, a={nombre:r.nombre||"Alumno de otra profesora",clases:[],faltas:[],token:r.tok,asist:{},recibos:[]};
    (S.sint||(S.sint=new Map())).set(id,a);for(const o of clasesDia(a,f,[r]))if(o.profe===p)out.push({id,a,o});
  }
  return out.sort((x,y)=>x.o.ini-y.o.ini||x.a.nombre.localeCompare(y.a.nombre,"es"));
}
const pasaLista=o=>o.t==="normal"||o.t==="extra";
/* «+1 h extra» en Asistencia (03/11/2026): el alumno se queda una hora más. Apunta una hora extra hoy, justo a continuación,
   con la misma profesora (la profesora por su buzón, dirección en la ficha). El recibo lo crea la app sola (recibosHX). */
async function masUnaHora(id,h,fin){const a=S.alumnos.get(id);if(!a)return;const p=S.role==="dir"?S.asP:S.myProfe,f=todayISO(),dia=diaDe(f);if(!p)return;

  if(FLEX.has(p)){const i=+fin;if(!(i>0))return;if(!dentroTramo(p,dia,i,i+60)){toast(`A las ${hm(i)} ya no entra en el horario de ${p}`);return}
    const ch=chocaSes(p,dia,i,"60");if(ch&&!confirm(`A las ${hm(i)} ${p} tiene a ${titulo(ch.a.nombre)}. ¿Apuntarla igualmente?`))return;
    e={fecha:f,hora:keyDeMin(i),profe:p,ini:hm(i),dur:60,tipo:"60"}}
  else{const k=HORAS[HORAS.indexOf(h)+1];if(!k||!trabaja(p,dia,k)){toast(`${p} no tiene la hora siguiente en su horario`);return}
    const n=ocupProfe(p)(f,k)||0,cap=capDe(p,dia,k);if(n>=cap&&!confirm(`La hora de ${HLABEL[k]} ya tiene ${n} alumno${n===1?"":"s"} (${cap===1?"individual":"máximo "+cap}). ¿Apuntarla igualmente?`))return;
    e={fecha:f,hora:k,profe:p}}
  if(extrasDe(a).some(x=>x.fecha===f&&x.hora===e.hora&&x.profe===p&&!x.anulada)){toast("Ya tiene apuntada esa hora extra");return}
  if(!confirm(`¿Apuntar a ${titulo(a.nombre)} una hora extra hoy, ${extraTxt(e)}? Se le hará el recibo.`))return;
  e={id:nuevoId("x"),...e,nota:"Se queda una hora más",creada:nowISO(),por:S.role==="profe"?p:quienSoy()};
  try{if(S.role==="profe"){const lim=sumaDias(f,-90),tras={};for(const [k,v] of Object.entries((S.miBuzon&&S.miBuzon.tras)||{}))if(v&&String(v.creada)>=lim)tras[k]=v;
      tras[e.id]={...e,tid:e.id,tipo:"hextra",tok:a.token||"",nombre:a.nombre};await guardarBuzonProfe({tras});rebuildOv();CONFC.l=null;SESC.al=null}
    else{const extras=[...(a.extras||[]),e];if(!await save(id,{extras}))return;a.extras=extras;setTimeout(()=>{try{recibosHX()}catch(_){}},500)}
    render();toast(`Hora extra apuntada: ${extraTxt(e)}`)}
  catch(x){console.warn(x);toast("No se ha podido guardar. Inténtalo de nuevo.")}}
/* ---------- Hora actual en Asistencia y Semana (02/11/2026) ----------
   Petición de las profesoras: saber por dónde va la tarde. Cada profesora elige en Asistencia (se recuerda en su dispositivo):
   - «Línea de la hora»: una línea roja con la hora, como Google Calendar, que va bajando entre las clases.
   - «Tiempo de cada clase»: en cada clase en marcha, «quedan X min»; al acabar, «ha terminado hace X min» (5 min).
   En Semana sale siempre la línea roja en la casilla de hoy y de la hora actual. Se actualiza sola cada minuto. */
const AHORA_ROJO="#d93025";
const relojModo=()=>{try{return localStorage.getItem("althea.reloj")||"linea"}catch(_){return S.relojModo||"linea"}};

const ahoraMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
function vRelojModo(){const m=relojModo();
  return `<div class="bar" style="gap:6px;margin:0 0 6px"><span class="note">Ver por dónde vamos:</span>${[["linea","Línea de la hora"],["tiempo","Tiempo de cada clase"]].map(([k,t])=>`<button class="chip" data-act="relojmodo" data-v="${k}" aria-pressed="${m===k}">${m===k?"✓ ":""}${t}</button>`).join("")}</div>`}
function ahoraEnLista(f,l,filas){
  if(f!==todayISO()||relojModo()!=="linea"||!l.length)return filas.join("");
  const n=ahoraMin(),i=l.findIndex(x=>x.o.ini>n),k=i<0?l.length:i,linea=`<div class="nowline" role="note" aria-label="Ahora, ${hm(n)}"><span>${hm(n)}</span></div>`;
  return [...filas.slice(0,k),linea,...filas.slice(k)].join("")}
function quedaTxt(f,o){

  if(n>=o.ini&&n<o.fin){const q=o.fin-n,pct=Math.round((n-o.ini)/(o.fin-o.ini)*100);
    return `<small style="color:${q<=10?AHORA_ROJO:"var(--accent)"};font-weight:600">${q<=10?"Quedan ":"En curso · quedan "}${q} min</small><span class="nowbar"><i style="width:${pct}%;background:${q<=10?AHORA_ROJO:"var(--accent)"}"></i></span>`}
  if(n>=o.fin&&n-o.fin<=5)return `<small style="color:${AHORA_ROJO};font-weight:600">Ha terminado ${n===o.fin?"ahora":`hace ${n-o.fin} min`}</small>`;

   Fijo (para siempre): dirección lo aplica en la ficha (aplicarTraspasos) cuando es de la misma profesora o la otra lo acepta;

async function reducirImagen(file,max=320){
  const url=URL.createObjectURL(file);
  try{const img=await new Promise((ok,ko)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>ko(new Error("img"));i.src=url});
    const k=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);return await new Promise(ok=>c.toBlob(b=>ok(b||file),"image/jpeg",.85))}
  catch(_){return file}finally{URL.revokeObjectURL(url)}
}

  setStatus("Subiendo foto…");
  try{const r=await assets.upload(await reducirImagen(file),{publico:true});const fotos={...(S.fotos||{}),[p]:{id:r.id,url:r.url}};
    await S.db.doc("config/fotos").set({fotos});S.fotos=fotos;quizasPublicar();render();toast("Foto de "+p+" guardada");setStatus("Al día")}
  catch(e){setStatus("Al día");toast("No se ha podido subir la foto"+(e&&e.code?` (${e.code})`:""))}

/* ---------- copia de seguridad (protocolo: al menos semanal) ----------
   Dirección descarga un JSON con todo lo guardado; la fecha queda en config/copias. */
const diasDesde=f=>f?Math.floor((Date.parse(todayISO())-Date.parse(String(f).slice(0,10)))/864e5):9999;
function vCopias(){
  const u=S.copias&&S.copias.ultima, d=diasDesde(u);
  return `<section class="card"><h3>Copia de seguridad</h3>
  <p class="note">El protocolo del centro pide una copia al menos cada semana, guardada fuera de este sistema (por ejemplo, en el ordenador del centro y en una memoria o servicio cifrado). El archivo lleva datos personales: guárdalo con cuidado.</p>
  ${u?`<p>Última copia: <b>${fmtFecha(String(u).slice(0,10))}</b>${d>7?` <span class="badge b-pend">hace ${d} días</span>`:""}</p>`:`<p><span class="badge b-pend">Todavía no se ha hecho ninguna copia</span></p>`}
  <button class="btn primary" data-act="copia">Descargar copia</button></section>`;
}
async function hacerCopia(){
  const dl=await window.claude.use("downloads");if(!dl){toast("Desde aquí no se pueden descargar archivos");return}
  setStatus("Preparando copia…");
  try{const out={app:"Horarios Althea",fecha:nowISO(),colecciones:{}};
    /* 14/11/2026: también todo lo de la fase 2 (banco, caja, recibos y facturas, nóminas, fichajes, impuestos, asesoría…).
       Los PDF y fotos (archivos) no van: ocuparían cientos de MB. Si una colección no se puede leer, se apunta y se sigue. */
    out.errores=[];
    for(const c of ["alumnos","privado","config","publico","claves","buzon","buzonProf","buzonAl","mensajes","preins","eventos","citas","caja","banco","ventas","facturas","facturasPrueba","facturasTaller","nominas","fichajes","impuestos","asesoria"]){
      try{setStatus("Copia: "+c+"…");const q=await S.db.collection(c).limit(5000).get();out.colecciones[c]={};q.docs.forEach(d=>{out.colecciones[c][d.id]=d.data()})}catch(e){out.errores.push(c)}}
    setStatus("Al día");
    await dl.save({filename:`copia-althea-${todayISO()}.json`,data:new Blob([JSON.stringify(out,null,1)],{type:"application/json"})});
    const c={ultima:nowISO()};await S.db.doc("config/copias").set(c);S.copias=c;render();toast("Copia descargada")}
  catch(e){setStatus("Al día");toast(e&&e.code==="declined"?"Descarga cancelada":"No se ha podido hacer la copia")}
}
/* ---------- conservación y bloqueo (protocolo de conservación; art. 32 LOPDGDD) ----------
   Alumnos de baja o antiguos sin recibos pendientes: se bloquean sus datos. Se borran horario, faltas, asistencia,
   foto y mensajes, y se guardan solo nombre y recibos hasta que venza el plazo legal (PLAZO_AÑOS). Después se borra la ficha. */
const PLAZO_AÑOS=6;
const paraBloquear=()=>sortedAlumnos().filter(([id,a])=>!a.bloqueado&&(a.bajaCerrada||(a.antiguo&&!a.clases.length))&&!pendTodos(a));
const vencidos=()=>sortedAlumnos().filter(([id,a])=>a.bloqueado&&a.bloqueado.hasta&&a.bloqueado.hasta<=todayISO());
function vConservacion(){
  const pb=paraBloquear(), ve=vencidos(), nb=sortedAlumnos().filter(([,a])=>a.bloqueado).length;
  return `<section class="card"><h3>Conservación de datos</h3>
  <p class="note">Cuando un alumno se va y no debe nada, sus datos se bloquean: se borran horario, faltas, asistencia, foto y mensajes, y se guardan solo su nombre y sus recibos durante ${PLAZO_AÑOS} años por las obligaciones fiscales y contables. Pasado ese plazo, se borra la ficha.</p>
  ${pb.length?`<p><b>${pb.length}</b> alumno${pb.length===1?"":"s"} de baja o antiguo${pb.length===1?"":"s"} para bloquear: <span class="note">${pb.slice(0,12).map(([,a])=>esc(titulo(a.nombre))).join(", ")}${pb.length>12?"…":""}</span></p>
    <span id="bloqbox"><button class="btn" data-act="bloquear">Bloquear sus datos</button></span>`:`<p class="note">No hay alumnos pendientes de bloquear.</p>`}
  ${ve.length?`<p style="margin-top:12px"><b>${ve.length}</b> con el plazo de conservación vencido: <span class="note">${ve.slice(0,12).map(([,a])=>esc(titulo(a.nombre))).join(", ")}</span></p><span id="supbox"><button class="btn danger" data-act="suprimir">Borrar definitivamente</button></span>`:""}
  ${nb?`<p class="note" style="margin-top:8px">${nb} alumno${nb===1?"":"s"} con datos bloqueados.</p>`:""}</section>`;
}
async function bloquearAlumnos(){
  const l=paraBloquear(), hasta=sumaDias(todayISO(),Math.round(PLAZO_AÑOS*365.25));let n=0;setStatus("Bloqueando…");
  for(const [id,a] of l){
    for(const u of cuentasDe(id)){try{await quitarAcceso(u)}catch(_){}for(const c of ["buzon","mensajes"]){try{await S.db.doc(c+"/"+u).delete()}catch(_){}}}
    const fid=a.foto&&a.foto.id;
    const p={clases:[],faltas:[],asist:{},foto:null,trasHechos:[],avisosHorario:[],msgResp:{},petResp:{},clave:"",bloqueado:{t:todayISO(),hasta}};
    if(await save(id,p)){Object.assign(a,p);n++;if(idOk(fid)){try{const as=await window.claude.use("assets");if(as)await as.delete(fid)}catch(_){}}}
  }
  setStatus("Al día");render();toast(`${n} alumno${n===1?"":"s"} bloqueado${n===1?"":"s"}`);
}
async function suprimirVencidos(){
  let n=0;for(const [id] of vencidos()){try{await S.db.collection("alumnos").doc(id).delete();S.alumnos.delete(id);syncAlumno(id,null);n++}catch(_){}}

}

/* QR con corrección de errores alta (H): el logo del centro tapa ~6 % de los módulos y se sigue leyendo (comprobado). */
const qrSvg=()=>{const S=QR_N+8,w=Math.round(QR_N*0.24),h=w*391/415,x=(S-w)/2,y=(S-h)/2;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${QR_VB}" shape-rendering="crispEdges" role="img" aria-label="Código QR de la app"><rect width="100%" height="100%" fill="#fff"/><path fill="#000" d="${QR_D}"/><rect x="${x-1}" y="${y-1}" width="${w+2}" height="${h+2}" rx="1" fill="#fff"/><image href="${LOGO_AF}" x="${x}" y="${y}" width="${w}" height="${h}"/></svg>`};
const digitos=v=>String(v||"").replace(/\D/g,"");
const nombreCorto=n=>{const t=titulo(n).split(" ").filter(Boolean);return t.length<3?t.join(" "):t.slice(0,-1).join(" ")+" "+t[t.length-1][0]+"."};
const claveAlta=()=>{const a=new Uint8Array(8);crypto.getRandomValues(a);return [...a].map(x=>x.toString(16).padStart(2,"0")).join("")};
let altaT=null;
function quizasAlta(){syncDerivados();return;
  if(S.role!=="dir"||S.pv||!S.alOk||!S.cfgAlOk||!S.altaOk)return;
  clearTimeout(altaT);altaT=setTimeout(async()=>{
    const map={...((S.alta&&S.alta.map)||{})}, porId={};for(const [k,id] of Object.entries(map))porId[id]=k;
    const l=[];for(const [id,a] of sortedAlumnos()){if(a.bloqueado||a.bajaCerrada||cuentasDe(id).length||esAntiguo(a))continue;
      let k=porId[id];if(!k){k=claveAlta();map[k]=id;porId[id]=k}l.push({k,n:nombreCorto(a.nombre),t:(a.telefonos||[]).length?1:0})}
    for(const [k,id] of Object.entries(map))if(!S.alumnos.has(id))delete map[k];
    const pubL=JSON.stringify(l);
    try{if(stable(map)!==stable((S.alta&&S.alta.map)||{})){await S.db.doc("config/alta").set({map});S.alta={map}}
      if(pubL!==S.altaPubL){await S.db.doc("publico/alta").set({l,actualizado:todayISO()});S.altaPubL=pubL}}catch(_){}
  },1500);
}
function vAltaBuscar(){
  const q=normUsuario(S.altaQ||""), l=(S.altaLista||[]);
  const res=q.length>=3?l.filter(x=>normUsuario(x.n).includes(q)).slice(0,8):[];
  const sel=l.find(x=>x.k===S.altaSel);
  return `<div class="altabox">
    <label class="f">Escribe tu nombre<input type="search" id="alta-q" autocomplete="off" placeholder="Por ejemplo, María García" value="${esc(S.altaQ||"")}"></label>
    ${q.length>=3?(res.length?`<div class="altares" role="list">${res.map(x=>`<button type="button" data-act="altasel" data-k="${esc(x.k)}" aria-pressed="${x.k===S.altaSel}">${esc(x.n)}</button>`).join("")}</div>`
      :`<p class="note">No te encontramos. Si ya entraste antes con otra cuenta, o acabas de matricularte, pregunta en recepción.</p>`):`<p class="note">Escribe al menos 3 letras.</p>`}
    ${sel?(sel.t?`<label class="f">Los 4 últimos números de tu móvil<input type="password" id="alta-tel" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="····"></label>
      <button class="btn primary" data-act="altaok">Entrar</button>`
      :`<p class="note">No tenemos tu móvil. Entra con el usuario y la clave que te da el centro, o pide ayuda en recepción.</p>`):""}
  </div>`;
}
async function enviarAlta(){
  const sel=(S.altaLista||[]).find(x=>x.k===S.altaSel), t=digitos(($("#alta-tel")||{}).value);
  if(!sel){toast("Elige tu nombre");return}if(t.length!==4){toast("Escribe los 4 últimos números de tu móvil");return}
  if(!S.me){toast("Abre el enlace con tu cuenta de Claude");return}
  S.screen="wait";S.rolElegido="alumno";S.miSolicitud={alta:sel.k,n:sel.n};render();
  try{await S.db.doc("solicitudes/"+S.me).set({fecha:todayISO(),rol:"alumno",alta:sel.k,tel4:t})}
  catch(_){S.screen="login";S.loginErr="permiso";render()}
}
function vQR(){
  const n=nAltasWeb();
  return `<section class="card"><h3>QR para recepción</h3>
  <p class="note">Imprímelo y ponlo en el mostrador. El alumno lo escanea y entra con su usuario y su clave. Si es su primera vez y no tiene clave, escribe su nombre y el móvil que dio en el centro, y elige una clave. Si ya había entrado en ese móvil, va directo a su horario. ${n?`Ahora pueden entrar así por primera vez <b>${n}</b> alumnos.`:""}</p>
  <div class="qrposter" id="qrposter"><h2>Althea Formación</h2><b>Tu horario en tu móvil</b>${qrSvg()}
    <ol><li>Escanea el código con la cámara.</li><li>Escribe tu usuario y tu clave.</li><li>¿Primera vez y sin clave? Pon tu nombre y tu móvil.</li></ol>
    <small style="color:#555">La próxima vez entrarás directamente.</small><b style="color:#b52e33">¿Aún no eres alumno? Pide tu inscripción en recepción.</b></div>
  <div class="petbtns" style="justify-content:center"><button class="btn primary" data-act="qrprint">Imprimir</button><button class="btn" data-act="qrpng">Descargar imagen</button></div></section>`;
}
async function descargarQR(){
  const dl=await window.claude.use("downloads");if(!dl){toast("Desde aquí no se pueden descargar archivos");return}
  const W=1240,H=1754,c=document.createElement("canvas");c.width=W;c.height=H;const g=c.getContext("2d");
  g.fillStyle="#fff";g.fillRect(0,0,W,H);g.fillStyle="#111";g.textAlign="center";
  g.font="bold 84px system-ui,sans-serif";g.fillText("Althea Formación",W/2,200);
  g.font="52px system-ui,sans-serif";g.fillText("Tu horario en tu móvil",W/2,300);
  const img=new Image();img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(qrSvg());await img.decode();
  g.imageSmoothingEnabled=false;g.drawImage(img,(W-820)/2,380,820,820);
  g.textAlign="left";g.font="46px system-ui,sans-serif";
  ["1. Escanea el código con la cámara.","2. Pulsa «Alumnos» y busca tu nombre.","3. Escribe los 4 últimos números de tu móvil."].forEach((t,i)=>g.fillText(t,170,1320+i*80));
  g.textAlign="center";g.fillStyle="#555";g.font="40px system-ui,sans-serif";g.fillText("La próxima vez entrarás directamente.",W/2,1580);g.fillStyle="#b52e33";g.font="bold 42px system-ui,sans-serif";g.fillText("¿Aún no eres alumno? Pide tu inscripción en recepción.",W/2,1670);
  const b=await new Promise(r=>c.toBlob(r,"image/png"));
  try{await dl.save({filename:"qr-althea-recepcion.png",data:b})}catch(e){if(!(e&&e.code==="declined"))toast("No se ha podido descargar")}
}

function insClaseTxt(c){return `${c.dia} ${c.ini?`${c.ini} (${(TIPOS[c.tipo]||{}).t||""})`:HLABEL[c.hora]} · ${c.profe}`}
/* Disponibilidad real para la inscripción: días que trabaja, horas de grupo con plaza (contando las ya elegidas aquí)
   y, en logopedia, horas de inicio que caben en su tramo sin pisar otra sesión. */
const insDias=p=>HORARIO_PROFE[p]?DIAS.filter(d=>(HORARIO_PROFE[p][d]||[]).length):DIAS;
function insLibres(p,dia,tipo){
  const I=S.ins;
  if(!FLEX.has(p))return horasFijas(p,dia).map(h=>{const ind=esIndividual(p,dia,h),cap=capDe(p,dia,h),occ=ocupadas(p,dia,h)+I.clases.filter(c=>c.profe===p&&c.dia===dia&&c.hora===h).length,l=cap-occ;
    return {v:h,l,ind,t:`${HLABEL[h]} · ${ind?"individual, libre":`grupo, ${l} plaza${l===1?"":"s"} libre${l===1?"":"s"}`}`}}).filter(x=>x.l>0&&(I.exc||!primariaMal(I.d.nivel,p,dia,x.v,x.ind)));
  const dur=(TIPOS[tipo]||TIPOS["60"]).dur,out=[];
  for(const [x,y] of tramosDe(p,dia))for(let t=x;t+dur<=y;t+=15){
    if(!dentroTramo(p,dia,t,t+dur)||chocaSes(p,dia,t,tipo))continue;
    if(tipo==="grupo"&&!I.exc&&primariaMal(I.d.nivel,p,dia,keyDeMin(t),false))continue;
    if(tipo==="grupo"){const n=sesionesDia(p,dia).filter(x=>x.tipo==="grupo"&&x.ini===t).length+(window.__resGrupo?window.__resGrupo(p,dia,t):0)+I.clases.filter(c=>c.profe===p&&c.dia===dia&&c.tipo==="grupo"&&c.ini===hm(t)).length;if(n>=CAP)continue;
      if(n){out.push({v:t,t:`${hm(t)}–${hm(t+dur)} · grupo, ${CAP-n} plaza${CAP-n===1?"":"s"} libre${CAP-n===1?"":"s"}`});continue}}
    if(I.clases.some(c=>c.profe===p&&c.dia===dia&&c.ini&&minDe(c.ini)<t+dur&&minDe(c.ini)+((TIPOS[c.tipo]||{}).dur||60)>t))continue;
    out.push({v:t,t:`${hm(t)}–${hm(t+dur)}`})}
  return out;
}
function insAddClase(){
  const I=S.ins,s=I.sel;let c={dia:s.dia,hora:s.hora,profe:s.profe};
  if(FLEX.has(c.profe)){const i=+s.ini,tp=s.tipo;
    if(!dentroTramo(c.profe,c.dia,i,i+TIPOS[tp].dur)){toast(`A las ${hm(i)} no le da tiempo dentro del horario de ${c.profe}: ${textoHorario(c.profe)}`);return}
    const ch=chocaSes(c.profe,c.dia,i,tp);if(ch){toast(`Se pisa con ${titulo(ch.a.nombre)} (${sesTxt(ch)})`);return}
    c={dia:c.dia,hora:keyDeMin(i),profe:c.profe,ini:hm(i),tipo:tp,sesT:nowISO()}}
  else{if(!trabaja(c.profe,c.dia,c.hora)){toast(`${c.profe} no trabaja el ${c.dia.toLowerCase()} de ${HLABEL[c.hora]}. Su horario: ${textoHorario(c.profe)}`);return}
    if(ocupadas(c.profe,c.dia,c.hora)>=capDe(c.profe,c.dia,c.hora)){toast(esIndividual(c.profe,c.dia,c.hora)?`Esa hora de ${c.profe} es individual y ya la tiene otro alumno`:`El grupo de ${c.profe} ya tiene ${CAP} alumnos`);return}}
  {const m=primariaMal(I.d.nivel,c.profe,c.dia,c.hora,indDe(c.profe,c.dia,c.hora,c.tipo));if(m&&!I.exc){toast(m);return}if(m)c.excPrim=true}
  if(I.clases.some(x=>x.dia===c.dia&&x.hora===c.hora)){toast("Ya tiene clase ese día a esa hora");return}
  I.clases.push(c);render();
}
function insValidar(){
  const I=S.ins,d=I.d;
  if(I.paso===0){if(!I.d.nivel){toast("Elige el nivel del alumno");return false}if(I.importe&&!/^\d+([.,]\d{1,2})?$/.test(String(I.importe).trim())){toast("Escribe el importe solo con números");return false}return true}
  if(I.paso===1){if(!String(d.nombre||"").trim()||!String(d.apellidos||"").trim()){toast("Escribe tu nombre y tus apellidos");return false}
    const e=edadDe(d.nac);if(e==null||e<1||e>110){toast("Escribe tu fecha de nacimiento");return false}
    if(digitos(d.tel).slice(-9).length!==9){toast("Escribe un teléfono de 9 cifras");return false}
    if(d.email&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(d.email)){toast("Revisa el correo electrónico");return false}
    const dniMal=v=>v&&!/^[XYZ0-9]\d{7}[A-Z]$|^[A-Z]\d{7}[A-Z0-9]$/.test(String(v).replace(/[\s.-]/g,"").toUpperCase());
    if(dniMal(d.dni)){toast("Revisa el DNI o NIE del alumno (8 números y una letra)");return false}
    if(dniMal(d.dnit)){toast("Revisa el DNI o NIE del padre, madre o tutor");return false}
    if(d.tel2&&digitos(d.tel2).slice(-9).length!==9){toast("El teléfono secundario tiene que tener 9 cifras");return false}
    if(e<18&&!String(d.tutor||"").trim()){toast("Escribe el nombre del padre, madre o tutor");return false}
    if(e<18&&!d.parentesco)d.parentesco="Madre";return true}
  if(I.paso===2){if(!I.cons.norma||!I.cons.priv){toast("Para inscribirte tienes que aceptar la normativa y la protección de datos");return false}return true}
  return true;
}
/* firma con el dedo o el ratón; se guarda como imagen en S.ins.firma para no perderla si la pantalla se redibuja */
function prepararFirma(){
  const cv=$("#firma");if(!cv||cv.dataset.ok)return;cv.dataset.ok="1";const g=cv.getContext("2d");
  g.lineWidth=4;g.lineCap="round";g.lineJoin="round";g.strokeStyle="#16213a";
  if(S.ins.firma){const im=new Image();im.onload=()=>g.drawImage(im,0,0);im.src=S.ins.firma}
  let on=false;const pos=e=>{const r=cv.getBoundingClientRect();return [(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]};
  cv.addEventListener("pointerdown",e=>{on=true;cv.setPointerCapture(e.pointerId);const [x,y]=pos(e);g.beginPath();g.moveTo(x,y);g.lineTo(x+.1,y+.1);g.stroke();e.preventDefault()});
  cv.addEventListener("pointermove",e=>{if(!on)return;const [x,y]=pos(e);g.lineTo(x,y);g.stroke();e.preventDefault()});
  const fin=()=>{if(!on)return;on=false;S.ins.firma=cv.toDataURL("image/png");S.ins.trazos=(S.ins.trazos||0)+1};
  cv.addEventListener("pointerup",fin);cv.addEventListener("pointercancel",fin);
}

const cargarImg=src=>new Promise((ok,ko)=>{const im=new Image();im.onload=()=>ok(im);im.onerror=ko;im.src=src});

   - Alta automática: en cuanto una preinscripción queda «completada», la página de dirección abierta (cualquier dispositivo) la da de

/* ---------- recibo que no cuadra con el horario ----------
   Para el mes elegido en Recibos: horas por semana que se cobran (según el curso del recibo: «2H/SEMANA», «LOGOPEDIA 8» = 2 por semana,
   «HORA INDIVIDUAL» = 1) frente a las clases que tiene en su horario. También avisa si el importe no es la tarifa del curso en Argos
   o no es lo pactado en la inscripción firmada. Cursos que no indican horas (consultas, pruebas de acceso) no se comparan. */
function horasDeCurso(c){c=String(c||"").toUpperCase();let m=c.match(/(\d+)\s*H\s*\/?\s*SEMANA/);if(m)return +m[1];
  m=c.match(/LOGOPEDIA\s*(\d+)/);if(m)return +m[1]/4;if(/HORA INDIVIDUAL/.test(c))return 1;return null}
const cursoEsc=mes=>{const [y,m]=String(mes).split("-").map(Number);return m>=9?`${y}-${y+1}`:`${y-1}-${y}`};

function noCuadra(a,mes,todo){

}
function noCuadra0(a,mes){
  if(!a||a.baja||a.sueltas)return [];/* clases sueltas: paga cada clase, no hay horas ni tarifa mensual que cuadrar */const rs=(a.recibos||[]).filter(r=>r&&!r.extra&&!r.clase&&String(r.emitido).startsWith(mes)&&!esReciboExtra(a,r));if(!rs.length)return [];

  const hh=a.clases.length;

  const pr=prorrMesAlta(a,mes),nS=a.clases.length;

  const primer=!(a.recibos||[]).some(r=>r&&!r.extra&&!r.clase&&!esReciboExtra(a,r)&&String(r.emitido||"").slice(0,7)<mes);
  const okPr=(imp,precio)=>{imp=+imp;if(pr&&Math.abs(imp-Math.round(precio*pr.f*100)/100)<=0.5)return true;
    if(!primer||!nS||!(imp<precio))return false;for(let q=1;q<4*nS;q++)if(Math.abs(imp-Math.round(precio*q/(4*nS)*100)/100)<=0.05)return true;return false};
  const cursos=(S.argos&&S.argos.cursos)||[];
  for(const r of rs){const c=cursos.find(x=>x.nombre===r.curso);if(c&&c.cuota&&r.importe!=null&&Math.abs(+r.importe-c.cuota)>0.5&&!okPr(r.importe,c.cuota))
    out.push({t:"tarifa",k:`tarifa|${r.curso}|${(+r.importe).toFixed(2)}`,txt:`Recibo ${r.numero||""} de ${eur(+r.importe)}; la tarifa de «${r.curso}» es ${eur(c.cuota)}`})}

  if(S.screen==="app"&&S.role!=="dir"){
    if(!S.link){S.screen="home";S.role="pend";S.ready=false;S.homeMsg="Dirección ha retirado tu acceso. Si crees que es un error, habla con el centro.";$("#sub").textContent="Horarios · Chiclana";render();return}
    entrarCuenta();return}
  if(S.screen==="home"&&S.link&&!S.esDir&&!S.salioInicio){entrarCuenta();return}
  if(S.screen==="home")render();
}
(async()=>{
  if(PRE_TOK){await window.__preListo;await arrancarPre();return}
  await window.__fbListo;
  const db=await window.claude?.use?.("db");
  if(!db){$("#boot").textContent="No se pueden cargar los datos. Recarga la página.";setStatus("Sin conexión");return}
  S.db=db;
  if(window.__fb&&window.__fb.CU&&window.__fb.CU.rol==="ase"&&typeof arrancarAsesoria==="function"){arrancarAsesoria(db);return}
  const user=await window.claude.use("user");S.user=user;
  /* Dirección = propietario de la app, o un Editor que ha entrado alguna vez con el PIN de dirección (config/direccion.uids).
     Las profesoras se invitan como Editor (Claude no ofrece otro nivel que pueda guardar datos) y, sin PIN, entran como profesoras.
     Mientras no haya PIN puesto, todo Editor es dirección, como antes. */
  S.esAdmin=user?await user.canEdit():false;S.esOwner=user?await user.isOwner():false;
  try{S.me=user?await user.id():null}catch(_){S.me=null}
  S.dirCfg=null;if(S.esAdmin){try{const d=await db.doc("config/direccion").get();S.dirCfg=d.exists?d.data():null}catch(_){}}
  const cfg=S.dirCfg;S.esDir=S.esOwner||(S.esAdmin&&(!cfg||!cfg.pinHash||(cfg.uids||[]).includes(S.me)));
  S.screen="home";render();
  if(!S.esDir){const b=$("#b-inicio");if(b){b.textContent="Salir";b.dataset.act="salir"}}
  if(S.esDir)arrancarDireccion(db);else arrancarCuenta(db,user);
})();
</script>
